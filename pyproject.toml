[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "alfa-rag-bot"
version = "0.2.0"
description = "Telegram RAG-помощник Альфа-Курса"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15,<4",
  "alembic>=1.16,<2",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "pgvector>=0.4.1,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "snowballstemmer>=2.2,<4",
  "beautifulsoup4>=4.12,<5",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
  "tiktoken>=0.9,<1",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.3,<6"]
dev = ["pytest>=8,<10", "aiosqlite>=0.20,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/alfa_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
