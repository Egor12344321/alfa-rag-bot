[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "alfa-rag-bot"
version = "0.5.0"
description = "Integrated Alfa Course assistant, knowledge retrieval and Telegram reminders"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiogram>=3.15,<4",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.6,<3",
  "httpx[socks]>=0.28,<1",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
  "numpy>=1.26,<3",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.3,<6"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.8,<1"]

[project.scripts]
alfa-bot = "alfa_bot.main:run"
alfa-import-bundle = "alfa_bot.knowledge.bundle:main"
alfa-ingest = "alfa_bot.knowledge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alfa_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires TEST_DATABASE_URL with PostgreSQL and pgvector"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
