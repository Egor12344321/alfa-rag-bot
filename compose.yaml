services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant_db}
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alfa}:${POSTGRES_PASSWORD:-alfa_local_only}@db:5432/${POSTGRES_DB:-assistant_db}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment: &runtime_env
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Moscow}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alfa}:${POSTGRES_PASSWORD:-alfa_local_only}@db:5432/${POSTGRES_DB:-assistant_db}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-unconfigured}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Включить профиль после реализации tick/outbox. Сейчас команда завершается
  # с понятным сообщением, чтобы не имитировать работающую доставку.
  worker:
    profiles: ["workers"]
    build: .
    command: ["alfa-worker"]
    environment: *runtime_env
    depends_on:
      migrate:
        condition: service_completed_successfully

  ingest:
    profiles: ["tools"]
    build: .
    command: ["alfa-ingest", "--help"]
    environment:
      <<: *runtime_env
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-}
    volumes:
      - ./private_data:/private_data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
